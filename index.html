<title>TrayCount</title>
<style>
:root{
  --bg:#07090f;--s1:rgba(255,255,255,.045);--s2:rgba(255,255,255,.075);--s3:rgba(255,255,255,.11);
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --text:#eef2fb;--muted:#8792aa;--dim:#5b647a;
  --mint:#34d399;--mint2:#10b981;--blue:#60a5fa;--amber:#fbbf24;--red:#f87171;--violet:#a78bfa;
  --r:18px;--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.35 var(--font);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 70% -10%,rgba(52,211,153,.07),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(96,165,250,.06),transparent 60%),var(--bg)}
button,input,select{font:inherit;color:inherit}
input,select{-webkit-user-select:text;user-select:text}
button{cursor:pointer;border:0;background:none}
svg{display:block}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

#app{display:grid;height:100%;grid-template-rows:auto minmax(0,1fr) auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:10px;padding:10px 16px 6px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.2px}
.logo i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#34d399,#3b82f6);display:grid;place-items:center;box-shadow:0 4px 14px rgba(52,211,153,.35)}
.logo i::after{content:"";width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.store{color:var(--muted);font-size:13px;font-weight:500}
.sp{flex:1}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s1);border:1px solid var(--line);transition:background .15s}
.ib:active{background:var(--s3)}
.ib svg{width:20px;height:20px;stroke:var(--text)}

main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;padding:6px 14px 10px;min-height:0}
#stageWrap{position:relative;min-height:0;min-width:0;display:grid;place-items:center}
#stage{position:relative;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.5);transition:box-shadow .3s;width:100%;height:100%}
#stage.match{box-shadow:0 0 0 2px var(--mint),0 0 40px rgba(52,211,153,.35),0 20px 60px rgba(0,0,0,.5)}
#stage.over{box-shadow:0 0 0 2px var(--red),0 0 40px rgba(248,113,113,.3),0 20px 60px rgba(0,0,0,.5)}
#stage video,#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#overlay{touch-action:none}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:rgba(10,13,22,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line2);font-size:13px;font-weight:600;white-space:nowrap;color:var(--text)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.ok .dot{background:var(--mint);box-shadow:0 0 0 4px rgba(52,211,153,.18)}
.chip.warn .dot{background:var(--amber);box-shadow:0 0 0 4px rgba(251,191,36,.18)}
.chip.edit{background:rgba(52,211,153,.18);border-color:rgba(52,211,153,.5)}
.hudTL{position:absolute;top:12px;left:12px;display:flex;gap:8px;z-index:3;flex-wrap:wrap}
.hudB{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;z-index:3;pointer-events:none}
#hint{transition:opacity .4s}
#zoomBox{position:absolute;right:12px;bottom:12px;z-index:3;display:none;align-items:center;gap:8px}
#zoomBox input{width:110px;accent-color:var(--mint)}
#banner{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:4;display:none}
#modeBar{position:absolute;bottom:14px;left:0;right:0;display:none;justify-content:center;gap:10px;z-index:4}
#debug{position:absolute;left:12px;bottom:12px;font-size:11px;color:#cbd5e1;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:6px;z-index:3;display:none}

#startCover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;z-index:6;background:radial-gradient(circle at 50% 35%,#132036 0%,#07090f 70%)}
#startCover h2{margin:0;font-size:26px;letter-spacing:-.5px}
#startCover p{margin:0;color:var(--muted);max-width:420px}
.orb{width:88px;height:88px;border-radius:28px;background:linear-gradient(135deg,#34d399,#3b82f6);display:grid;place-items:center;box-shadow:0 18px 50px rgba(52,211,153,.35);animation:float 3s ease-in-out infinite}
.orb svg{width:40px;height:40px;stroke:#04130c;stroke-width:2.2}
@keyframes float{50%{transform:translateY(-6px)}}
.cta{background:linear-gradient(180deg,#3ee0a5,#10b981);color:#03170e;font-weight:800;font-size:17px;padding:15px 30px;border-radius:16px;box-shadow:0 10px 30px rgba(16,185,129,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.cta:active{transform:scale(.98)}
#startErr{color:#fca5a5;font-size:13px;max-width:420px}

aside{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto;scrollbar-width:none}
aside>*{flex-shrink:0}
aside::-webkit-scrollbar{display:none}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
#ringCard{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 14px 12px;position:relative;overflow:hidden}
#ringCard::before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 50% 40%,var(--glow,transparent),transparent 55%);transition:background .4s;pointer-events:none}
.ringBox{position:relative;width:176px;height:176px;flex:none}
.ringBox svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ringBox circle{fill:none;stroke-width:12;stroke-linecap:round}
#ringTrack{stroke:rgba(255,255,255,.07)}
#ringProg{stroke:var(--blue);transition:stroke-dashoffset .35s cubic-bezier(.2,.8,.2,1),stroke .3s}
.ringIn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#count{font-size:68px;font-weight:800;letter-spacing:-3px;line-height:1;transition:transform .18s}
#count.bump{transform:scale(1.08)}
#ofTarget{color:var(--muted);font-weight:600;font-size:14px;margin-top:4px;min-height:18px}
.ringSide{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
#status{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;color:var(--muted);min-height:20px}
#status .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
#status.stable .dot{background:var(--mint);box-shadow:0 0 0 4px rgba(52,211,153,.18)}
#status.stable{color:#a7f3d0}
#status.warn{color:#fde68a}#status.warn .dot{background:var(--amber)}
#verdict{font-weight:800;font-size:15px;padding:7px 14px;border-radius:999px;background:var(--s2);color:var(--muted);transition:all .25s}
#verdict.go{color:#bfdbfe;background:rgba(96,165,250,.14)}
#verdict.ok{color:#03170e;background:var(--mint)}
#verdict.over{color:#fff;background:var(--red)}
#verdict.chk{color:#1c1300;background:var(--amber)}
#hudCount{position:absolute;top:12px;right:12px;z-index:3;font-size:26px;font-weight:800;padding:6px 14px;letter-spacing:-.5px}
#hudCount.ok{background:rgba(16,185,129,.85);border-color:var(--mint);color:#03170e}
#hudCount.over{background:rgba(239,68,68,.85);border-color:var(--red)}
#hudCount.chk{background:rgba(251,191,36,.9);border-color:var(--amber);color:#1c1300}
#hudCount small{font-size:14px;font-weight:700;opacity:.75;margin-left:3px}

.tgt{display:flex;align-items:center;gap:10px}
.tgt label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;flex:1}
.step{display:flex;align-items:center;background:var(--s2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.step button{width:44px;height:44px;font-size:22px;font-weight:600}
.step button:active{background:var(--s3)}
.step input{width:64px;height:44px;text-align:center;background:transparent;border:0;font-size:22px;font-weight:800;outline:none}
.presets{display:flex;gap:6px;margin-top:10px}
.presets button{flex:1;padding:8px 0;border-radius:10px;background:var(--s1);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--muted)}
.presets button.on{color:var(--text);border-color:var(--line2);background:var(--s2)}

.rxHead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rxHead b{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;flex:1;font-weight:600}
.field{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field span{width:80px;flex:none;font-size:12px;color:var(--muted);font-weight:600}
.field input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:15px;font-weight:600;padding:2px 0}
.field input::placeholder{color:var(--dim);font-weight:500}
#bottleInfo{font-size:12.5px;color:var(--muted);padding:0 0 8px 90px;line-height:1.4}
#bottleInfo b{color:var(--text);font-weight:600}
#verify{display:flex;align-items:center;gap:8px;margin-top:6px;padding:10px 12px;border-radius:12px;background:var(--s1);color:var(--muted);font-weight:600;font-size:13.5px}
#verify svg{width:18px;height:18px;flex:none}
#verify.ok{background:rgba(52,211,153,.12);color:#a7f3d0}
#verify.bad{background:rgba(248,113,113,.14);color:#fecaca;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.tools{display:flex;flex-wrap:wrap;gap:8px}
.tool{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-weight:600;font-size:13px}
.tool svg{width:16px;height:16px}
.tool.on{border-color:rgba(52,211,153,.5);color:#a7f3d0;background:rgba(52,211,153,.08)}
.tool:active{background:var(--s3)}

nav#bar{display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(7,9,15,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 6px;border-radius:14px;font-size:12px;font-weight:600;color:#c7cfdf;min-height:58px}
.nb svg{width:22px;height:22px;stroke:currentColor}
.nb:active{background:var(--s2)}
.nb.save{flex:1.6;flex-direction:row;gap:10px;white-space:nowrap;font-size:17px;font-weight:800;color:#03170e;background:linear-gradient(180deg,#3ee0a5,#10b981);box-shadow:0 8px 24px rgba(16,185,129,.3),inset 0 1px 0 rgba(255,255,255,.35)}
.nb.save svg{stroke:#03170e;stroke-width:2.4}
.nb.save:active{transform:scale(.98)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(720px,100%);max-height:88vh;overflow:auto;background:#10141f;border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));z-index:41;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.wide{width:min(1000px,100%)}
.sheet.show{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 14px}
.sheet h2{margin:0 0 4px;font-size:21px;letter-spacing:-.3px}
.sheet .sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.sheet .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.btn{padding:13px 20px;border-radius:14px;font-weight:700;background:var(--s2);border:1px solid var(--line)}
.btn.pri{background:var(--mint2);border-color:var(--mint2);color:#03170e}
.btn.danger{background:rgba(248,113,113,.15);border-color:rgba(248,113,113,.4);color:#fecaca}
.inp{width:100%;background:var(--s1);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
.inp:focus{border-color:var(--mint)}
select.inp option{background:#10141f}
.warnList{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.warnList li{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);color:#fde68a;font-weight:600}
.setg{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.setg label.t{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.setg input[type=range]{width:100%;accent-color:var(--mint)}
.setg .note{font-size:12px;color:var(--dim);margin-top:4px}
.tog{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-weight:600}
.tog input{width:20px;height:20px;accent-color:var(--mint)}
.logList{display:flex;flex-direction:column;gap:10px}
.logItem{display:flex;gap:12px;padding:10px;border-radius:14px;background:var(--s1);border:1px solid var(--line);align-items:center}
.logItem img{width:92px;height:68px;object-fit:cover;border-radius:10px;flex:none}
.logItem .m{flex:1;min-width:0}
.logItem .t1{display:flex;gap:8px;align-items:baseline;font-weight:700}
.logItem .big{font-size:22px;font-weight:800}
.t2{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:700}
.tag.ok{background:rgba(52,211,153,.15);color:#a7f3d0}.tag.bad{background:rgba(248,113,113,.15);color:#fecaca}.tag.na{background:var(--s2);color:var(--muted)}
.help li{margin-bottom:10px;color:#cdd5e5}
.help b{color:var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:6px 0 10px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid #fff}

#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-160%);background:rgba(16,20,31,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);padding:12px 18px;border-radius:16px;font-weight:600;z-index:60;max-width:92vw;text-align:center;transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 12px 40px rgba(0,0,0,.5)}
#toast.show{transform:translate(-50%,0)}

/* compact (phones, portrait) */
#compact{display:none}
.rxLine{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);text-align:left;overflow:hidden}
.rxLine span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rxLine b{color:var(--text)}
@media (orientation:portrait),(max-width:860px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:10px;padding:4px 10px 8px}
  aside{overflow:visible}
  #ringCard{flex-direction:row;align-items:center;gap:14px;padding:10px 12px}
  .ringBox{width:112px;height:112px}
  .ringBox circle{stroke-width:11}
  #count{font-size:44px;letter-spacing:-1.5px}
  #ofTarget{font-size:12px;margin-top:2px}
  .ringSide{flex:1;align-items:stretch;min-width:0;gap:7px}
  #status{font-size:12.5px}
  #verdict{align-self:flex-start;font-size:14px;padding:5px 12px}
  #tgtCard,#rxCard,#toolsCard{display:none}
  #compact{display:flex;flex-direction:column;gap:7px}
  #compact .step button{width:40px;height:38px}
  #compact .step input{height:38px;width:56px;font-size:19px}
  #compact .row{display:flex;gap:7px;align-items:center}
  header{padding:8px 12px 4px}
  .ib{width:36px;height:36px}
  .nb{min-height:52px;font-size:11px}
  .nb.save{font-size:16px}
  .nb.save svg{display:none}
  .store{display:none}
  #trainChip .lbl{display:none}
  .setg{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><i></i>TrayCount</div>
    <span class="store" id="storeName"></span>
    <div class="sp"></div>
    <button class="chip" id="trainChip" style="display:none"><span class="dot" style="background:#a78bfa"></span><span class="num" id="trainN">0</span><span class="lbl">&nbsp;training photos</span></button>
    <button class="ib" id="bLog" aria-label="Count log"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
    <button class="ib" id="bHelp" aria-label="Setup tips"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg></button>
    <button class="ib" id="bSettings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
  </header>

  <main>
    <section id="stageWrap">
      <div id="stage">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="overlay"></canvas>
        <div class="hudTL">
          <button class="chip" id="trayChip"><span class="dot"></span><span id="trayTxt">Tray</span></button>
          <button class="chip" id="fixChip" style="display:none"><span id="fixTxt"></span>&nbsp;·&nbsp;Undo</button>
        </div>
        <div class="chip num" id="hudCount" style="display:none"></div>
        <div class="hudB"><div class="chip" id="hint" style="opacity:0">Tap a dot to remove it · tap an empty spot to add</div></div>
        <div id="zoomBox" class="chip"><span>Zoom</span><input type="range" id="zoom"></div>
        <div id="banner" class="chip"></div>
        <div id="modeBar"></div>
        <div id="debug"></div>
        <div id="startCover">
          <div class="orb"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.5"/></svg></div>
          <h2>Point at the tray</h2>
          <p>Camera straight down, tray filling the view. Pills are counted as they land.</p>
          <button class="cta" id="bStart">Start counting</button>
          <div id="startErr"></div>
        </div>
      </div>
    </section>

    <aside>
      <div class="card" id="ringCard">
        <div class="ringBox">
          <svg viewBox="0 0 220 220"><circle id="ringTrack" cx="110" cy="110" r="96"/><circle id="ringProg" cx="110" cy="110" r="96"/></svg>
          <div class="ringIn"><div id="count" class="num">0</div><div id="ofTarget" class="num"></div></div>
        </div>
        <div class="ringSide">
          <div id="status"><span class="dot"></span><span id="statusTxt">Camera off</span></div>
          <div id="verdict">No target</div>
          <div id="compact">
            <div class="row"><div class="step"><button data-step="-1">−</button><input id="targetC" class="num" inputmode="numeric" placeholder="qty"><button data-step="1">+</button></div></div>
            <button class="rxLine" id="rxLine"><span id="rxLineTxt">Add Rx details</span></button>
          </div>
        </div>
      </div>

      <div class="card" id="tgtCard">
        <div class="tgt"><label>Target qty</label>
          <div class="step"><button data-step="-1">−</button><input id="target" class="num" inputmode="numeric" placeholder="—"><button data-step="1">+</button></div>
        </div>
        <div class="presets" id="presets"><button>30</button><button>60</button><button>90</button><button>120</button></div>
      </div>

      <div class="card" id="rxCard">
        <div class="rxHead"><b>Prescription</b><button class="tag na" id="rxClear">Clear</button></div>
        <div id="rxFields"></div>
      </div>

      <div id="toolsCard" style="display:none"><div class="tools" id="tools"></div></div>
    </aside>
  </main>

  <nav id="bar">
    <button class="nb" id="bBottle"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>Scan bottle</button>
    <button class="nb" id="bLabel"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>Read label</button>
    <button class="nb save" id="bSave"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Save count</button>
    <button class="nb" id="bTools"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/></svg>Tray</button>
    <button class="nb" id="bNew"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>New Rx</button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="toast"></div>

<script>
// ===== TrayCount counting engine (pure JS, no DOM) =====
const PillEngine = (() => {
  // Estimate tray color as the most common color (tray dominates the frame).
  function autoBackground(px, w, h, roi) {
    const hist = new Uint32Array(4096);
    const sums = new Float64Array(4096 * 3);
    const R0 = roi || { x0: 0, y0: 0, x1: w - 1, y1: h - 1 };
    for (let y = R0.y0; y <= R0.y1; y += 2) for (let x = R0.x0 + (y & 2 ? 1 : 0); x <= R0.x1; x += 2) {
      const o = (y * w + x) * 4, r = px[o], g = px[o + 1], b = px[o + 2];
      const bin = ((r >> 4) << 8) | ((g >> 4) << 4) | (b >> 4);
      hist[bin]++; sums[bin * 3] += r; sums[bin * 3 + 1] += g; sums[bin * 3 + 2] += b;
    }
    // smooth over neighbouring bins so a tray split across two bins still wins
    let best = 0, bestV = -1;
    for (let bin = 0; bin < 4096; bin++) {
      if (!hist[bin]) continue;
      const r = bin >> 8, g = (bin >> 4) & 15, b = bin & 15;
      let v = 0;
      for (let dr = -1; dr <= 1; dr++) for (let dg = -1; dg <= 1; dg++) for (let db = -1; db <= 1; db++) {
        const rr = r + dr, gg = g + dg, bb = b + db;
        if (rr < 0 || gg < 0 || bb < 0 || rr > 15 || gg > 15 || bb > 15) continue;
        v += hist[(rr << 8) | (gg << 4) | bb];
      }
      if (v > bestV) { bestV = v; best = bin; }
    }
    // mean color of pixels near the winning bin
    const R = best >> 8, G = (best >> 4) & 15, B = best & 15;
    let c = 0, sr = 0, sg = 0, sb = 0;
    for (let dr = -1; dr <= 1; dr++) for (let dg = -1; dg <= 1; dg++) for (let db = -1; db <= 1; db++) {
      const rr = R + dr, gg = G + dg, bb = B + db;
      if (rr < 0 || gg < 0 || bb < 0 || rr > 15 || gg > 15 || bb > 15) continue;
      const k = (rr << 8) | (gg << 4) | bb;
      c += hist[k]; sr += sums[k * 3]; sg += sums[k * 3 + 1]; sb += sums[k * 3 + 2];
    }
    return [sr / c, sg / c, sb / c];
  }

  // Lighting-aware background: median tray colour in a coarse grid over the tray, interpolated per pixel.
  function bgGrid(px, w, h, R) {
    const gx = 8, gy = 6, cw = (R.x1 - R.x0 + 1) / gx, ch = (R.y1 - R.y0 + 1) / gy, cols = new Float32Array(gx * gy * 3);
    for (let j = 0; j < gy; j++) for (let i = 0; i < gx; i++) {
      const xs = Math.floor(R.x0 + i * cw), xe = Math.floor(R.x0 + (i + 1) * cw), ys = Math.floor(R.y0 + j * ch), ye = Math.floor(R.y0 + (j + 1) * ch);
      const keys = [];
      for (let y = ys; y < ye; y += 3) for (let x = xs; x < xe; x += 3) { const o = (y * w + x) * 4; keys.push(((px[o] * 0.3 + px[o + 1] * 0.59 + px[o + 2] * 0.11) | 0) * 16777216 + px[o] * 65536 + px[o + 1] * 256 + px[o + 2]); }
      const ks = Float64Array.from(keys).sort();
      const samp = Array.from(ks, k => { const c = k % 16777216; return [Math.floor(k / 16777216), c >> 16, (c >> 8) & 255, c & 255]; });
      const mid = samp[samp.length >> 1] || [0, 0, 0, 0];
      cols.set([mid[1], mid[2], mid[3]], (j * gx + i) * 3);
    }
    // a cell that disagrees sharply with its neighbours (crowded with pills / shadow) takes their median instead
    const fixed = new Float32Array(cols);
    for (let j = 0; j < gy; j++) for (let i = 0; i < gx; i++) {
      const nb = [];
      for (const [a, b] of [[i - 1, j], [i + 1, j], [i, j - 1], [i, j + 1], [i - 1, j - 1], [i + 1, j + 1], [i - 1, j + 1], [i + 1, j - 1]]) if (a >= 0 && b >= 0 && a < gx && b < gy) nb.push((b * gx + a) * 3);
      const med = [0, 1, 2].map(k => { const v = nb.map(o => cols[o + k]).sort((x, y) => x - y); return v[v.length >> 1]; });
      const o = (j * gx + i) * 3, dd = Math.hypot(cols[o] - med[0], cols[o + 1] - med[1], cols[o + 2] - med[2]);
      if (dd > 30) fixed.set(med, o);
    }
    return { gx, gy, cw, ch, cols: fixed, R };
  }
  function bgAt(G, x, y, out) {
    let fx = (x - G.R.x0) / G.cw - 0.5, fy = (y - G.R.y0) / G.ch - 0.5;
    fx = Math.max(0, Math.min(G.gx - 1, fx)); fy = Math.max(0, Math.min(G.gy - 1, fy));
    const i0 = Math.floor(fx), j0 = Math.floor(fy), i1 = Math.min(G.gx - 1, i0 + 1), j1 = Math.min(G.gy - 1, j0 + 1), ax = fx - i0, ay = fy - j0;
    for (let k = 0; k < 3; k++) {
      const a = G.cols[(j0 * G.gx + i0) * 3 + k], b = G.cols[(j0 * G.gx + i1) * 3 + k], c = G.cols[(j1 * G.gx + i0) * 3 + k], d = G.cols[(j1 * G.gx + i1) * 3 + k];
      out[k] = (a * (1 - ax) + b * ax) * (1 - ay) + (c * (1 - ax) + d * ax) * ay;
    }
    return out;
  }

  // Exposure drift compensation for a calibrated per-pixel model
  function gainVsModel(px, model, n) {
    const ratios = [];
    for (let i = 0; i < n; i += 37) {
      const o = i * 4, m = i * 3;
      const lb = model[m] + model[m + 1] + model[m + 2];
      if (lb < 30) continue;
      ratios.push((px[o] + px[o + 1] + px[o + 2]) / lb);
    }
    if (ratios.length < 20) return 1;
    ratios.sort((a, b) => a - b);
    const k = ratios[ratios.length >> 1];
    return Math.min(1.6, Math.max(0.6, k));
  }

  function buildMask(px, w, h, opt, model) {
    const n = w * h, mask = new Uint8Array(n), dist = new Float32Array(n);
    const thr2 = opt.threshold * opt.threshold;
    const weak = opt.weakThr ? new Uint8Array(n) : null, wk2 = opt.weakThr ? opt.weakThr * opt.weakThr : 0;
    const R = opt.roi;
    let bg = null, gain = 1, G = null; const tmp = [0, 0, 0];
    if (model) gain = gainVsModel(px, model, n);
    else {
      const IR = opt.bgRoi || R, mx = Math.round((IR.x1 - IR.x0) * 0.06), my = Math.round((IR.y1 - IR.y0) * 0.06);
      const GR = { x0: IR.x0 + mx, y0: IR.y0 + my, x1: IR.x1 - mx, y1: IR.y1 - my }; // stay off the tray rim / counter slivers
      bg = autoBackground(px, w, h, GR);
      const st = opt.state || {}, key = GR.x0 + ',' + GR.y0 + ',' + GR.x1 + ',' + GR.y1;
      if (st._G && st._Gkey === key && st._Gage < 5) { G = st._G; st._Gage++; }
      else { G = bgGrid(px, w, h, GR); st._G = G; st._Gkey = key; st._Gage = 0; }
    }
    // precompute horizontal interpolation once per frame
    let I0, I1, AX; if (G) { I0 = new Int32Array(w); I1 = new Int32Array(w); AX = new Float32Array(w); for (let x = 0; x < w; x++) { let fx = (x - G.R.x0) / G.cw - 0.5; fx = Math.max(0, Math.min(G.gx - 1, fx)); I0[x] = Math.floor(fx); I1[x] = Math.min(G.gx - 1, I0[x] + 1); AX[x] = fx - I0[x]; } }
    const rowBg = new Float32Array(w * 3);
    for (let yy = R.y0; yy <= R.y1; yy++) {
      if (G) {
        let fy = (yy - G.R.y0) / G.ch - 0.5; fy = Math.max(0, Math.min(G.gy - 1, fy));
        const j0 = Math.floor(fy), j1 = Math.min(G.gy - 1, j0 + 1), ay = fy - j0, C = G.cols, gx = G.gx;
        for (let xx = R.x0; xx <= R.x1; xx++) { const a0 = (j0 * gx + I0[xx]) * 3, b0 = (j0 * gx + I1[xx]) * 3, c0 = (j1 * gx + I0[xx]) * 3, d0 = (j1 * gx + I1[xx]) * 3, ax = AX[xx];
          for (let k = 0; k < 3; k++) rowBg[xx * 3 + k] = (C[a0 + k] * (1 - ax) + C[b0 + k] * ax) * (1 - ay) + (C[c0 + k] * (1 - ax) + C[d0 + k] * ax) * ay; }
      }
    for (let xx = R.x0; xx <= R.x1; xx++) {
      const i = yy * w + xx, o = i * 4;
      let br, bgc, bb;
      if (model) { const m = i * 3; br = model[m] * gain; bgc = model[m + 1] * gain; bb = model[m + 2] * gain; }
      else { br = rowBg[xx * 3]; bgc = rowBg[xx * 3 + 1]; bb = rowBg[xx * 3 + 2]; }
      const r = px[o], g = px[o + 1], b = px[o + 2];
      const dr = r - br, dg = g - bgc, db = b - bb;
      const d2 = dr * dr + dg * dg + db * db;
      if (weak && d2 > wk2) weak[i] = 1;
      if (d2 <= thr2) continue;
      if (opt.shadow) {
        // shadow = same hue as tray, just darker
        const I = r + g + b + 1, Ib = br + bgc + bb + 1, ratio = I / Ib;
        if (ratio > 0.4 && ratio < 0.97) {
          const cd = Math.abs(r / I - br / Ib) + Math.abs(g / I - bgc / Ib) + Math.abs(b / I - bb / Ib);
          if (cd < 0.07) continue;
        }
      }
      mask[i] = 1; dist[i] = Math.sqrt(d2);
    }
    }
    return { mask, dist, weak, bg, gain };
  }

  function erode(m, w, h) {
    const o = new Uint8Array(m.length);
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      if (m[i] && m[i - 1] && m[i + 1] && m[i - w] && m[i + w]) o[i] = 1;
    }
    return o;
  }
  function dilate(m, w, h) {
    const o = new Uint8Array(m.length);

  const head = ['Date/time', 'Rx #', 'Drug', 'Label NDC', 'Bottle NDC', 'Lot', 'Exp (YYMMDD)', 'NDC check', 'Target', 'Final count', 'Hand fixes', 'Initials', 'Notes'];
  const csv = [head, ...logRows.map(r => cols.map(c => c === 'ts' ? new Date(r.ts).toLocaleString() : r[c] ?? ''))].map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `traycount-${new Date().toISOString().slice(0, 10)}.csv`; document.body.appendChild(a); a.click(); a.remove();
}
$('bLog').onclick = openLog;

// ---------- settings ----------
$('bSettings').onclick = () => sheet(`<h2>Settings</h2><p class="sub">Saved on this device.</p>
  <div class="setg">
    <div><label class="t">Your initials</label><input class="inp" id="sInitials" maxlength="5" style="text-transform:uppercase" value="${esc(S.initials)}"></div>
    <div><label class="t">Store name</label><input class="inp" id="sStore" value="${esc(S.store)}"></div>
    <div><label class="t">Camera</label><select class="inp" id="sCamera"><option>Current camera</option></select></div>
    <div><label class="t">Detail</label><select class="inp" id="sRes"><option value="480">Fast</option><option value="640">Standard</option><option value="800">Fine (tiny pills)</option></select></div>
    <div><label class="t">Sensitivity <span id="vThr">${S.thr}</span></label><input type="range" id="sThr" min="18" max="90" value="${S.thr}"><div class="note">Lower picks up pills close to the tray color. Higher ignores glare and dust.</div></div>
    <div><label class="t">Ignore specks <span id="vMin">${S.min}</span></label><input type="range" id="sMin" min="1" max="40" value="${S.min}"><div class="note">Raise if crumbs or glare get dots.</div></div>
    <div><label class="t">Steadiness <span id="vSm">${S.smooth}</span></label><input type="range" id="sSm" min="3" max="20" value="${S.smooth}"><div class="note">Frames the count must hold before "Stable".</div></div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <label class="tog">Ignore shadows<input type="checkbox" id="sShadow" ${S.shadow ? 'checked' : ''}></label>
      <label class="tog">Collect training photos<input type="checkbox" id="sCollect" ${S.collect ? 'checked' : ''}></label>
      <label class="tog">Read label automatically<input type="checkbox" id="sAuto" ${S.autoLabel ? 'checked' : ''}></label>
      <label class="tog">Sounds<input type="checkbox" id="sSound" ${S.sound ? 'checked' : ''}></label>
      <label class="tog">Diagnostics<input type="checkbox" id="sDebug" ${S.debug ? 'checked' : ''}></label>
    </div>
  </div>
  <div class="acts"><button class="btn" id="sForget">Forget saved pill sizes</button><button class="btn pri" data-v="1">Done</button></div>`, {
  onOpen: (b) => {
    const q = (id) => b.querySelector('#' + id);
    q('sRes').value = String(S.res); listCameras();
    q('sInitials').oninput = e => { S.initials = e.target.value.toUpperCase().trim(); saveS(); };
    q('sStore').oninput = e => { S.store = e.target.value; saveS(); labels(); };
    q('sRes').onchange = e => { S.res = +e.target.value; saveS(); fit(); };
    q('sCamera').onchange = e => { S.cameraId = e.target.value; S.zoom = null; saveS(); startCamera(); };
    [['sThr', 'thr', 'vThr'], ['sMin', 'min', 'vMin'], ['sSm', 'smooth', 'vSm']].forEach(([id, k, v]) => q(id).oninput = e => { S[k] = +e.target.value; q(v).textContent = S[k]; saveS(); hist = []; });
    [['sShadow', 'shadow'], ['sAuto', 'autoLabel'], ['sSound', 'sound'], ['sDebug', 'debug'], ['sCollect', 'collect']].forEach(([id, k]) => q(id).onchange = e => { S[k] = e.target.checked; saveS(); updateTrainChip(); if (k === 'collect' && S[k]) try { navigator.storage.persist(); } catch {} });
    q('sForget').onclick = () => { unitMem = {}; ls.set('tc_units', unitMem); toast('Saved pill sizes cleared'); };
  }
});
function labels() { $('storeName').textContent = S.store || ''; }

// ---------- help ----------
$('bHelp').onclick = () => sheet(`<h2>Getting great counts</h2><p class="sub">A couple minutes of setup makes counts fast and reliable.</p>
<div class="legend"><span><i style="background:#34d399"></i>1 pill</span><span><i style="background:#60a5fa"></i>touching (number shown)</span><span><i style="background:#fbbf24"></i>½ broken / half tab</span><span><i style="background:#a78bfa"></i>added by you</span><span style="color:#f87171">✕ removed by you</span><span><i style="background:#fbbf24"></i>? check this spot</span></div>
<ol class="help">
<li><b>Start with the tray empty and your hands out of view</b> so the tray locks cleanly. Then pour.</li>
<li><b>Mount it overhead.</b> Camera straight down, 10–14 in. above the tray. A fixed height keeps saved pill sizes accurate.</li>
<li><b>Matte, solid tray.</b> Navy or black for light pills, white for dark pills. <b>Avoid shiny trays:</b> a glare spot can look exactly like a white pill. The corner brackets lock onto the tray and everything outside is ignored.</li>
<li><b>Even light.</b> A small LED panel overhead cuts shadows and glare.</li>
<li><b>Single layer.</b> Touching pills are split by size, but stacked pills can't be seen. Spread them with the spatula.</li>
<li><b>Fix misses with a tap.</b> Tap a dot to remove it, tap an empty spot to add a pill. Undo is at the top-left of the camera.</li>
<li><b>Lock pill size</b> (Tray button) once a few pills are apart. After a bottle scan, it's remembered for that NDC.</li>
<li>This is a counting aid. Always confirm the final count visually.</li></ol>
<div class="acts"><button class="btn pri" data-v="1">Got it</button></div>`);

// ---------- boot ----------
$('bStart').onclick = startCamera;
$('ringProg').style.strokeDasharray = RING_C; $('ringProg').style.strokeDashoffset = RING_C;
renderRx(); renderTools(); labels(); updateTrayChip(); updateCount(); updateTrainChip();
$('trainChip').onclick = openTraining;
try { if (S.collect && navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
requestAnimationFrame(loop);
window.__tc = { TRAIN, openTraining, exportTraining, get last() { return last; }, get tray() { return tray; }, onBarcode, verify, syncTarget, setRx, get adds() { return adds; }, get removes() { return removes; } };
})();
</script>
</body>
</html>
